<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Progress — fictional staff preview</title><style> *{box-sizing:border-box}body{margin:0;background:#f8fafb;color:#20363d;font:15px system-ui,sans-serif}.preview-banner{background:#174c52;color:white;padding:12px 20px;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}dialog{max-width:min(90vw,500px);border:1px solid #9cbdc2;border-radius:14px;padding:24px;color:#20363d}dialog::backdrop{background:#18363d66}.sp-shell{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,40px);color:inherit}.sp-shell h1{font-size:clamp(28px,4vw,42px);margin:4px 0}.sp-shell h2{font-size:20px;font-weight:500;margin:0 0 18px}.sp-kicker,.sp-muted,.sp-shell small,.sp-shell footer{color:inherit;opacity:.72}.sp-kicker{text-transform:uppercase;letter-spacing:.12em;font-size:11px}.sp-top,.sp-tools,.sp-card-foot,.sp-tabs{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sp-top,.sp-card-foot{justify-content:space-between}.sp-tools{margin:16px 0}.sp-tools label{display:flex;gap:6px;flex-direction:column;font-size:12px}.sp-tools input,.sp-tools select,.sp-button{font:inherit;color:inherit;border:1px solid #a4b6b8;border-radius:8px;padding:8px 12px;background:transparent}.sp-button{cursor:pointer}.sp-button:hover,.sp-button:focus-visible,.sp-button[aria-pressed=true]{border-color:#16868b;box-shadow:0 0 0 1px #16868b}.sp-stats,.sp-grid,.sp-module-grid{display:grid;gap:14px}.sp-stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.sp-grid,.sp-module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sp-stat,.sp-card{border:1px solid #9cbdc2;border-radius:14px;padding:18px;min-width:0;background:rgba(128,160,164,.045)}.sp-stat{display:grid;gap:5px}.sp-stat strong,.sp-rate{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums}.sp-stat span,.sp-card p,.sp-card small{font-size:13px}.sp-class-link{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;font-size:19px;cursor:pointer;overflow-wrap:anywhere}.sp-class-link:hover strong{text-decoration:underline}.sp-track{height:7px;border-radius:10px;background:rgba(128,145,150,.22);overflow:hidden}.sp-track span{display:block;background:#16868b;height:100%;border-radius:10px}.sp-chart{display:flex;gap:4px;align-items:stretch;height:88px;margin:14px 0;overflow-x:auto}.sp-chart-day{flex:1;min-width:18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;padding-bottom:17px}.sp-bar{width:70%;max-width:28px;height:var(--height);background:#16868b;border-radius:3px;min-height:0}.sp-chart-day small{position:absolute;bottom:0;font-size:9px;white-space:nowrap}.sp-card-foot{border-top:1px solid #9cbdc2;padding-top:10px;font-size:12px}.sp-card-foot .sp-button{color:#98701c}.sp-tabs{margin:10px 0 18px}.sp-table-wrap{overflow:auto}.sp-table{width:100%;border-collapse:collapse;font-size:14px}.sp-table th,.sp-table td{text-align:left;padding:11px 10px;border-bottom:1px solid #b9c8cb;vertical-align:middle}.sp-table th{font-size:12px;white-space:nowrap}.sp-table td small{display:block}.sp-table td .sp-button{border:0;padding:0;text-align:left;color:inherit;text-decoration:underline}.sp-module-grid h3{margin-top:0;overflow-wrap:anywhere}.sp-module-grid strong{font-size:25px}.sp-module-grid .sp-button{display:block;margin-top:12px}.sp-shell footer{font-size:12px;margin-top:20px}.sp-shell :focus-visible{outline:2px solid #16868b;outline-offset:3px}@media(max-width:720px){.sp-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.sp-grid,.sp-module-grid{grid-template-columns:1fr}.sp-stat,.sp-card{padding:13px}.sp-stat strong,.sp-rate{font-size:24px}}</style></head><body><aside class="preview-banner"><strong>iGCSE SELF-STUDY HUB · STAFF PREVIEW</strong><span>Fictional records · Snapshot 27 November 2026 · No live connection</span></aside><main id="app"></main><dialog id="detail"><h2 id="detail-name"></h2><p id="detail-body"></p><form method="dialog"><button class="sp-button">Close</button></form></dialog><script>const practice = Object.freeze({
  engagement: true, answerAttempts: true, completions: 'limited',
  assessment: 'limited', coverage: 'limited', release: 'production', drilldown: 'activity'
});
const writer = Object.freeze({
  submissions: true, coverage: 'limited', release: 'production', drilldown: 'writing-activity'
});

const REPORTING_CAPABILITIES = Object.freeze({
  vocabulary_paraphrase: Object.freeze({
    ...practice, completions: true, assessment: true, mastery: true, merits: true, drilldown: 'vocabulary'
  }),
  email_writing: writer,
  essay_writing: Object.freeze({ ...writer, engagement: true }),
  review_writing: Object.freeze({ ...writer, pilot: 'structure', preview: 'academy' }),
  reading: practice,
  listening: practice,
  paraphrasing: practice
});

function evidenceState({ retrieval = 'ok', coverage, hasEvidence = false, sufficient = true } = {}) {
  if (retrieval === 'restricted') return 'permission-restricted';
  if (retrieval !== 'ok') return 'retrieval-failure';
  if (coverage === 'pilot') return 'pilot-only';
  if (!coverage || coverage === 'unavailable') return 'tracking-unavailable';
  if (!sufficient) return 'insufficient-evidence';
  if (hasEvidence) return 'recorded';
  return coverage === 'limited' ? 'limited-coverage' : 'no-records';
}

const SCHOOL_TIME_ZONE = 'Asia/Shanghai';
const DAY = 86_400_000;
const schoolDate = new Intl.DateTimeFormat('en-CA', {
  timeZone: SCHOOL_TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit'
});

function schoolDay(timestamp) {
  if (!Number.isFinite(timestamp)) return null;
  const parts = Object.fromEntries(schoolDate.formatToParts(timestamp).map(part => [part.type, part.value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function midnight(day) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day ?? '')) throw new RangeError('Expected a school date');
  const timestamp = Date.parse(`${day}T00:00:00+08:00`);
  if (schoolDay(timestamp) !== day) throw new RangeError('Invalid school date');
  return timestamp;
}

function timestampOf(value) {
  if (value instanceof Date) return value.getTime();
  if (typeof value === 'number') return value;
  return typeof value === 'string' && /(?:Z|[+-]\d{2}:?\d{2})$/i.test(value) ? Date.parse(value) : NaN;
}

function reportingPeriod(kind, { now = new Date(), from, to } = {}) {
  const asOf = timestampOf(now);
  const today = midnight(schoolDay(asOf));
  let start = today;
  let end = today + DAY;
  switch (kind) {
    case 'today': break;
    case 'last7': start = asOf - 7 * DAY; end = asOf + 1; break;
    case 'last30': start = asOf - 30 * DAY; end = asOf + 1; break;
    case 'thisWeek': {
      const weekday = new Date(today + 8 * 3_600_000).getUTCDay();
      start -= ((weekday + 6) % 7) * DAY;
      end = start + 7 * DAY;
      break;
    }
    case 'custom': start = midnight(from); end = midnight(to) + DAY; break;
    default: throw new RangeError('Unknown reporting period');
  }
  if ((kind === 'custom' && from > to) || start >= end) throw new RangeError('Reversed reporting period');
  return { start, end, asOf };
}


const names = new Intl.Collator('en', { numeric:true, sensitivity:'base' });
const known = row => Number.isInteger(row.activeDays) && row.activeDays >= 0 &&
  ['recorded','no-records'].includes(row.practiceState);

// Input must be the authorised Phase 1 snapshot, never a global profile list.
// Unknown evidence is not counted as inactivity. Merits are lifetime, not period totals.
function buildClassOverview(snapshot) {
  if (!snapshot || !Array.isArray(snapshot.students)) return { available:false, classes:[], totals:null };
  const groups = new Map();
  const seen = new Set();
  for (const row of snapshot.students) {
    if (!row.studentId || !row.classId || seen.has(row.studentId)) continue;
    seen.add(row.studentId);
    if (!groups.has(row.classId)) groups.set(row.classId, { classId:row.classId, className:row.className, students:[] });
    groups.get(row.classId).students.push(row);
  }
  const summarize = rows => {
    const observed = rows.filter(known);
    const active = observed.filter(row => row.activeDays > 0);
    const modules = Object.keys(REPORTING_CAPABILITIES).map(appKey => ({
      appKey, learners:active.filter(row => (row.learningAreas ?? []).includes(appKey)).length,
      coverage:REPORTING_CAPABILITIES[appKey].coverage,
      pilot:REPORTING_CAPABILITIES[appKey].pilot ?? null
    }));
    const complete = observed.length === rows.length;
    const meritKnown = rows.every(row => Number.isInteger(row.pendingMerits) && row.pendingMerits >= 0);
    return {
      enrolled:rows.length, observed:observed.length, unknown:rows.length-observed.length,
      activeLearners:complete ? active.length : null,
      recordedActiveLearners:active.length,
      participation:complete && rows.length ? active.length / rows.length : null,
      learningAreasUsed:complete ? modules.filter(m => m.learners > 0).length : null,
      pendingMerits:meritKnown ? rows.reduce((n,row) => n+row.pendingMerits,0) : null,
      modules:modules.map(m => ({ ...m, learners:complete ? m.learners : null, recordedLearners:m.learners }))
    };
  };
  const classes = [...groups.values()].sort((a,b) => names.compare(a.className ?? '', b.className ?? '')).map(group => ({
    ...group, ...summarize(group.students),
    students:[...group.students].sort((a,b) => names.compare(a.displayName ?? '',b.displayName ?? ''))
  }));
  return { available:true, preview:snapshot.preview === true, classes,
    totals:{ ...summarize(classes.flatMap(group => group.students)), classes:classes.length } };
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function safeHttpsUrl(value) {
  try {
    const url = new URL(String(value ?? ''));
    return url.protocol === 'https:' ? url.href : '#';
  } catch {
    return '#';
  }
}

const h=escapeHtml;

const labels = { vocabulary_paraphrase:'Vocabulary & Paraphrase Builder', email_writing:'Informal Email Writing', essay_writing:'Essay Writing', review_writing:'Review Writing', reading:'Reading', listening:'Listening', paraphrasing:'Standalone Paraphrasing' };
const periods = [['thisWeek','This week'],['today','Today'],['last7','Last 7 days'],['last30','Last 30 days'],['custom','Custom']];
const val = x => x == null ? 'Unavailable' : h(String(x));
const pct = x => x == null ? 'Unavailable' : Math.round(x*100)+'%';
const attr = h;
const button = (action,label,extra='') => '<button type="button" class="sp-button" data-action="'+action+'" '+extra+'>'+h(label)+'</button>';
const stat = (label,value,detail='') => '<div class="sp-stat"><span>'+h(label)+'</span><strong>'+val(value)+'</strong><small>'+h(detail)+'</small></div>';
function daily(group,period) {
  if (!period || group.unknown) return '<p class="sp-muted">Daily engagement unavailable.</p>';
  const start=Date.parse(schoolDay(period.start)+'T00:00:00+08:00');
  const end=Math.min(period.end-1,period.asOf);
  const days=[];
  for(let t=start;t<=end;t+=86400000) {
    const key=schoolDay(t);
    days.push({key,count:group.students.filter(s=>(s.activeDateKeys??[]).includes(key)).length});
    if(days.length>31) return '<p class="sp-muted">Select a period of up to 31 days for the daily chart.</p>';
  }
  if (!days.length) return '<p class="sp-muted">No elapsed days in this period.</p>';
  return '<div class="sp-chart" role="img" aria-label="'+attr(days.map(d=>d.key+': '+d.count+' learners').join('; '))+'">'+days.map(d=>'<div class="sp-chart-day" title="'+attr(d.key+': '+d.count)+'"><span class="sp-bar" style="--height:'+Math.round(100*d.count/Math.max(group.enrolled,1))+'%"></span><small>'+h(d.key.slice(5))+'</small></div>').join('')+'</div>';
}
function card(c,period) {
  return '<article class="sp-card"><button type="button" class="sp-class-link" data-action="sp-class" data-class-id="'+attr(c.classId)+'"><strong>'+h(c.className??'Class')+'</strong><span aria-hidden="true">›</span></button><p class="sp-muted">'+c.enrolled+' enrolled students</p><div class="sp-rate">'+pct(c.participation)+'</div><p>'+val(c.activeLearners)+' / '+c.enrolled+' learners with recorded practice</p>'+ (c.participation==null?'':'<div class="sp-track"><span style="width:'+Math.round(c.participation*100)+'%"></span></div>')+daily(c,period)+'<div class="sp-card-foot"><span>'+val(c.learningAreasUsed)+' learning areas</span>'+button('sp-merits',c.pendingMerits==null?'Merits unavailable':c.pendingMerits+' pending merits','data-class-id="'+attr(c.classId)+'"')+'</div></article>';
}
function table(c,state) {
  const query=String(state.search??'').toLowerCase();
  const rows=c.students.filter(s=>(!state.meritsOnly||s.pendingMerits>0)&&[s.displayName,s.studentNumber].some(v=>String(v??'').toLowerCase().includes(query)));
  const sort=state.sort??'name';
  if(sort==='days') rows.sort((a,b)=>(b.activeDays??-1)-(a.activeDays??-1));
  if(sort==='merits') rows.sort((a,b)=>(b.pendingMerits??-1)-(a.pendingMerits??-1));
  if(sort==='recent') rows.sort((a,b)=>String(b.lastPractice??'').localeCompare(String(a.lastPractice??'')));
  return '<div class="sp-tools"><label>Search students <input data-sp-search value="'+attr(state.search??'')+'" placeholder="Name or school number"></label><label>Sort <select data-sp-sort>'+[['name','Name'],['days','Active days'],['recent','Last practice'],['merits','Pending merits']].map(([v,l])=>'<option value="'+v+'" '+(sort===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label>'+button('sp-toggle-merits',state.meritsOnly?'Show all students':'Pending merits only')+'</div><div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>Student</th><th>Last practice in period</th><th>Active days</th><th>Learning areas</th><th>Recent module</th><th>Pending merits</th></tr></thead><tbody>'+rows.map(s=>'<tr><td>'+button('sp-student',s.displayName??'Student','data-student-id="'+attr(s.studentId)+'"')+'<small>'+h(s.studentNumber??'')+'</small></td><td>'+h(s.lastPractice?new Date(s.lastPractice).toLocaleString('en-GB',{timeZone:SCHOOL_TIME_ZONE,day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):s.activeDays==null?'Unavailable':'No recorded practice')+'</td><td>'+val(s.activeDays)+'</td><td>'+val(s.activeDays==null?null:s.learningAreas?.length??0)+'</td><td>'+h(labels[s.recentModule]??'—')+'</td><td>'+val(s.pendingMerits)+'</td></tr>').join('')+'</tbody></table>'+(!rows.length?'<p class="sp-muted">No matching students.</p>':'')+'</div>';
}
function modules(c) {
 return '<div class="sp-module-grid">'+c.modules.map(m=>'<article class="sp-card"><h3>'+h(labels[m.appKey]??m.appKey)+'</h3><strong>'+val(m.learners)+' / '+c.enrolled+'</strong><p>Students with recorded practice</p><small>'+(m.coverage==='limited'?'Limited coverage':'Recorded evidence')+(m.pilot?' · Academy pilot separate':'')+'</small>'+(['email_writing','essay_writing','review_writing'].includes(m.appKey)?button('writing-activity','Writing Activity'):'')+'</article>').join('')+'</div>';
}
function renderStudentProgress(root,state) {
 const model=buildClassOverview(state.snapshot);
 const group=model.classes.find(c=>c.classId===state.classId);
 const totals=model.totals;
 const tabs=['overview','students','learning'];
 let body='';
 if(state.awaitingDates) body='<p role="status">Choose your dates and select Apply dates.</p>';
 else if(state.loading) body='<p role="status">Loading student progress…</p>';
 else if(!model.available) body='<p role="alert">Student progress is unavailable.</p>'+button('sp-refresh','Try again');
 else if(group) body='<div class="sp-tabs">'+tabs.map(t=>button('sp-tab',({overview:'Overview',students:'Students',learning:'Learning areas'})[t],'data-tab="'+t+'" aria-pressed="'+(state.tab===t)+'"')).join('')+'</div>'+(state.tab==='students'?table(group,state):state.tab==='learning'?modules(group):card(group,state.period));
 else body='<div class="sp-stats">'+stat('Classes',totals.classes,'With enrolled students')+stat('Students',totals.enrolled,'Current roster')+stat('Active learners',totals.activeLearners,'Selected period')+stat('Pending merits',totals.pendingMerits,'All time · Vocabulary')+'</div><div class="sp-grid">'+model.classes.map(c=>card(c,state.period)).join('')+'</div>'+(!model.classes.length?'<p>No authorised classes with enrolled students.</p>':'');
 root.innerHTML='<section class="sp-shell"><div class="sp-top">'+button('sp-back',state.classId?'‹ All classes':'‹ Back to Hub')+button('sp-refresh','Refresh')+'</div><header><p class="sp-kicker">Teacher workspace</p><h1>Student Progress</h1><h2>'+h(group?.className??'My classes at a glance')+'</h2></header><div class="sp-tools"><label>Reporting period <select data-sp-period>'+periods.map(([k,l])=>'<option value="'+k+'" '+(state.kind===k?'selected':'')+'>'+l+'</option>').join('')+'</select></label>'+(state.kind==='custom'?'<label>From <input type="date" data-sp-from value="'+attr(state.from??'')+'"></label><label>To <input type="date" data-sp-to value="'+attr(state.to??'')+'"></label>'+button('sp-apply','Apply dates'):'')+'</div>'+(state.error?'<p role="alert">'+h(state.error)+'</p>':'')+(model.preview?'<p>Illustrative preview data</p>':'')+body+'<footer>Recorded practice only. Missing records do not indicate poor performance. Module coverage varies. School time: Asia/Shanghai.</footer></section>';
}


const root=document.getElementById('app');
const now=new Date('2026-11-27T09:30:00Z');
const groups=[['demo-a','Grade 9 ESL A',13,11],['demo-b','Grade 9 ESL B',20,16],['demo-c','Grade 10 ESL A',22,19],['demo-d','Grade 11 ESL A',19,12]];
const first=['Alex','Bailey','Casey','Drew','Emery','Finley','Harper','Jamie','Jordan','Kai','Lee','Morgan','Noah','Oakley','Parker','Quinn','Reese','Riley','Rowan','Sam','Taylor','Wren'];
const last=['Chen','Lin','Wang','Liu','Zhang','Huang','Zhou','Xu','Yang','Wu','Sun','He','Gao','Ma','Zhao','Lu','Hu','Guo','Tang','Qian','Fang','Shen'];
const keys=Object.keys(REPORTING_CAPABILITIES);
const roster=groups.flatMap(([classId,className,n,active],g)=>Array.from({length:n},(_,i)=>{
 const events=[];
 for(let d=0;d<31;d++){
  if(d<5 && i>=active)continue;
  if(d===4 && i<active || (i*7+d*3+g*5)%11<4){
   const at=Date.parse('2026-11-27T02:00:00Z')-d*86400000+(i%6)*3600000;
   events.push({at,key:keys[(i+d+g)%keys.length]});
  }
 }
 return {studentId:classId+'-'+i,classId,className,displayName:first[i]+' '+last[(i+g*5)%last.length],studentNumber:String(81000+g*100+i),pendingMerits:i===2?2:i===5&&g!==3?1:0,events};
}));
let state={kind:'thisWeek',from:'2026-11-23',to:'2026-11-27',classId:null,tab:'overview',search:'',sort:'name',meritsOnly:false};
function draw(){renderStudentProgress(root,state)}
function load(){
 try{const period=reportingPeriod(state.kind,{now,from:state.from,to:state.to});if(state.kind==='custom'&&period.end-period.start>31*86400000)throw Error('Choose at most 31 days.');
 state={...state,period,error:null,awaitingDates:false,snapshot:{preview:true,students:roster.map(({events,...s})=>{
 const selected=events.filter(e=>e.at>=period.start&&e.at<period.end&&e.at<=period.asOf).sort((a,b)=>b.at-a.at);
 const dates=[...new Set(selected.map(e=>schoolDay(e.at)))];
 return {...s,activeDays:dates.length,activeDateKeys:dates,practiceState:dates.length?'recorded':'no-records',learningAreas:[...new Set(selected.map(e=>e.key))],lastPractice:selected.length?new Date(selected[0].at).toISOString():null,recentModule:selected[0]?.key};
 })}};}catch(e){state={...state,error:e.message,snapshot:null,awaitingDates:true};}draw();
}
root.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;
 if(a==='sp-back'){state={...state,classId:null,tab:'overview',search:'',meritsOnly:false};draw();}
 if(a==='sp-refresh'||a==='sp-apply')load();
 if(a==='sp-class'||a==='sp-merits'){state={...state,classId:t.dataset.classId,tab:a==='sp-merits'?'students':'overview',search:'',meritsOnly:a==='sp-merits'};draw();}
 if(a==='sp-tab'){state.tab=t.dataset.tab;draw();}
 if(a==='sp-toggle-merits'){state.meritsOnly=!state.meritsOnly;draw();}
 if(a==='sp-student'){const s=state.snapshot.students.find(s=>s.studentId===t.dataset.studentId);if(s){document.getElementById('detail-name').textContent=s.displayName;document.getElementById('detail-body').textContent='School number: '+s.studentNumber+' · Active days: '+s.activeDays+' · Pending merits: '+s.pendingMerits+'. Individual detail is simulated in this preview; live awards are disabled.';document.getElementById('detail').showModal();}}
 if(a==='writing-activity'){document.getElementById('detail-name').textContent='Writing Activity';document.getElementById('detail-body').textContent='The production writing workspace is not connected to this fictional preview.';document.getElementById('detail').showModal();}
});
root.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-sp-period]')){state.kind=t.value;if(t.value==='custom'){state.awaitingDates=true;state.snapshot=null;draw();}else load();}if(t.matches('[data-sp-from]'))state.from=t.value;if(t.matches('[data-sp-to]'))state.to=t.value;if(t.matches('[data-sp-sort]')){state.sort=t.value;draw();}if(t.matches('[data-sp-search]')){state.search=t.value;draw();}});
root.addEventListener('input',e=>{if(e.target.matches('[data-sp-search]')){const pos=e.target.selectionStart;state.search=e.target.value;draw();const input=root.querySelector('[data-sp-search]');input?.focus();input?.setSelectionRange(pos,pos);}});
load();
</script></body></html>
