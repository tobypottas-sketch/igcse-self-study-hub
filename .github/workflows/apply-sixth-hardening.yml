name: Apply Sixth Hardening
on:
  push:
    branches: [fix/sixth-hardening-audit-20261015]
    paths: ['.github/audit6-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sixth-hardening-audit-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Hub tracking
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/tracking/reading-wrapper.js')
          s=p.read_text()
          if 'READING_TEXT_INPUT_DEBOUNCE_MS' not in s:
              s=s.replace('const FLUSH_SECONDS = 60;\n','const FLUSH_SECONDS = 60;\nconst READING_TEXT_INPUT_DEBOUNCE_MS = 700;\n',1)
          if 'const pendingAnswerTimers = new Map();' not in s:
              s=s.replace('const reconciledExamPapers = new Set();\n','const reconciledExamPapers = new Set();\nconst pendingAnswerTimers = new Map();\n',1)
          marker='function trackAnswer(win, questionId) {'
          if 'function queueReadingAnswerTracking' not in s:
              helper="function clearPendingReadingAnswers(win) {\n  for (const timer of pendingAnswerTimers.values()) win.clearTimeout(timer);\n  pendingAnswerTimers.clear();\n}\n\nfunction queueReadingAnswerTracking(win, questionId) {\n  const key = String(questionId);\n  const existing = pendingAnswerTimers.get(key);\n  if (existing) win.clearTimeout(existing);\n  const timer = win.setTimeout(() => {\n    pendingAnswerTimers.delete(key);\n    trackAnswer(win, questionId);\n  }, READING_TEXT_INPUT_DEBOUNCE_MS);\n  pendingAnswerTimers.set(key, timer);\n}\n\nfunction trackAnswer(win, questionId) {"
              if marker not in s: raise SystemExit('Reading trackAnswer anchor missing')
              s=s.replace(marker,helper,1)
          old="const normal = wrapAfter(win, 'saveAnswer', ([questionId]) => trackAnswer(win, questionId));"
          new="const normal = wrapAfter(win, 'saveAnswer', ([questionId]) => {\n    const paper = activePaper(win);\n    const context = paper ? findReadingQuestion(paper, questionId) : null;\n    if (context && (context.exercise.type === 'short_answers' || context.exercise.type === 'notes')) {\n      queueReadingAnswerTracking(win, questionId);\n      return;\n    }\n    trackAnswer(win, questionId);\n  });"
          if old in s: s=s.replace(old,new,1)
          old_reset="function resetExamTracking(win) {\n  const paper = activePaper(win);\n  if (!paper) return;\n  reconciledExamPapers.delete(paper.id);\n  for (const key of [...examAnswered]) {\n    if (key.startsWith(`${paper.id}:`)) examAnswered.delete(key);\n  }\n}\n"
          new_reset="function resetExamTracking(win) {\n  const paper = activePaper(win);\n  if (!paper) return;\n  reconciledExamPapers.delete(paper.id);\n  for (const key of [...examAnswered]) {\n    if (key.startsWith(`${paper.id}:`)) examAnswered.delete(key);\n  }\n  for (const key of [...attempts.keys()]) {\n    if (String(key).startsWith(`exam:${paper.id}:`)) attempts.delete(key);\n  }\n}\n"
          if old_reset in s: s=s.replace(old_reset,new_reset,1)
          reps=[("wrapAfter(win, 'startNewExamAttempt', () => { if (!paperHasAnyAnswer(win)) resetExamTracking(win); });","wrapAfter(win, 'startNewExamAttempt', () => { clearPendingReadingAnswers(win); if (!paperHasAnyAnswer(win)) resetExamTracking(win); });"),("wrapAfter(win, 'setStudyMode', () => { if (!paperHasAnyAnswer(win)) resetExamTracking(win); });","wrapAfter(win, 'setStudyMode', () => { clearPendingReadingAnswers(win); if (!paperHasAnyAnswer(win)) resetExamTracking(win); });"),("wrapAfter(win, 'loadSelectedPaper', () => seedReadingExamTracking(win));","wrapAfter(win, 'loadSelectedPaper', () => { clearPendingReadingAnswers(win); seedReadingExamTracking(win); });")]
          for old,new in reps:
              if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/tracking/essay-writing-wrapper.js')
          s=p.read_text()
          if 'let trackedWindow = null;' not in s:
              s=s.replace('let timer = null;\nlet profile = null;','let timer = null;\nlet trackedWindow = null;\nlet profile = null;',1)
          marker='function wrapAfter(win, functionName, after) {'
          if 'function currentEssayMode' not in s:
              helper="function currentEssayMode(win) {\n  try {\n    return typeof win?.isPracticeMode === 'function' && !win.isPracticeMode() ? 'exam' : 'practice';\n  } catch {\n    return 'practice';\n  }\n}\n\nfunction wrapAfter(win, functionName, after) {"
              if marker not in s: raise SystemExit('Essay wrapAfter anchor missing')
              s=s.replace(marker,helper,1)
          s=s.replace("studyMode: typeof win.isPracticeMode === 'function' && !win.isPracticeMode() ? 'exam' : 'practice'","studyMode: currentEssayMode(win)",1)
          s=s.replace("skill: `essay_${stage}`,\n      metadata: { word_count: safeWordCount(win) }","skill: `essay_${stage}`,\n      mode: currentEssayMode(win),\n      metadata: { word_count: safeWordCount(win) }",1)
          s=s.replace("skill: 'essay_draft_management',\n      metadata: { word_count: safeWordCount(win) }","skill: 'essay_draft_management',\n      mode: context.studyMode,\n      metadata: { word_count: safeWordCount(win) }",1)
          s=s.replace("track({ event_type: 'active_time', active_seconds: seconds });","track({ event_type: 'active_time', active_seconds: seconds, mode: trackedWindow ? currentEssayMode(trackedWindow) : 'practice' });",1)
          s=s.replace("function startActiveTime(win) {\n  ['pointerdown', 'keydown', 'input', 'touchstart'].forEach(type => {","function startActiveTime(win) {\n  trackedWindow = win;\n  ['pointerdown', 'keydown', 'input', 'touchstart'].forEach(type => {",1)
          s=s.replace("track({ event_type: 'app_open' });","track({ event_type: 'app_open', mode: currentEssayMode(win) });",1)
          s=s.replace("track({ event_type: 'section_use', activity_id: 'stage:task', skill: 'essay_task', metadata: { word_count: safeWordCount(win) } });","track({ event_type: 'section_use', activity_id: 'stage:task', skill: 'essay_task', mode: currentEssayMode(win), metadata: { word_count: safeWordCount(win) } });",1)
          p.write_text(s)
          PY
      - run: node --test tests/*.test.js tests/*.test.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tracking/reading-wrapper.js src/tracking/essay-writing-wrapper.js
          git diff --cached --quiet || git commit -m "fix: harden sixth-audit Hub tracking"
          git push
