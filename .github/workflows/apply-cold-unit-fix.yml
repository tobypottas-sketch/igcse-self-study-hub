name: Apply approved cold-unit fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cold-unit-single-render-merge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved patch
        run: |
          base64 -d .merge-staging/cold-unit.patch.gz.b64 | gzip -d > /tmp/cold-unit.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/cold-unit.patch
      - name: Run full test suite
        run: npm test
      - name: Remove staging and push branch
        run: |
          git rm -r .merge-staging
          git commit -m "Remove temporary cold-unit patch staging"
          git push origin HEAD:fix/cold-unit-single-render-merge
