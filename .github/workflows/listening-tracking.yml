name: Listening Tracking

on:
  push:
    branches:
      - feat/teacher-activity-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/tracking/listening-core.js
      - run: node --check src/tracking/listening-engagement.js
      - run: node --check src/tracking/listening-wrapper.js
