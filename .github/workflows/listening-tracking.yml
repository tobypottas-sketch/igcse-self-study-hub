name: Listening Tracking

on:
  push:
    branches:
      - feat/teacher-activity-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/listening-tracking-core.test.js tests/listening-engagement.test.js tests/listening-wrapper-shell.test.js tests/listening-instrumentation.test.js
