name: One-shot vocabulary Edge served-stage patch

on:
  push:
    branches: [fix/fixed-vocabulary-pathways]
    paths:
      - '.github/workflows/patch-vocab-edge-served-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fixed-vocabulary-pathways
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-vocab-edge-served-stage.mjs
      - run: node --test tests/vocabulary-pathway-support-credit.test.js
      - name: Commit patched Edge and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: forward served pathway support stage"
          git push origin HEAD:fix/fixed-vocabulary-pathways
