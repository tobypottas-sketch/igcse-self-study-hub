name: Diagnostic student readiness
on:
  pull_request:
    paths:
      - 'src/vocabulary/diagnostic-entry-gate.js'
      - 'src/vocabulary/diagnostic-student.js'
      - 'supabase/functions/vocabulary-diagnostic/provisional-scoring.js'
      - 'tests/vocabulary-diagnostic-stage2-student-readiness.test.js'
      - '.github/workflows/diagnostic-student-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'src/vocabulary/diagnostic-entry-gate.js'
      - 'src/vocabulary/diagnostic-student.js'
      - 'supabase/functions/vocabulary-diagnostic/provisional-scoring.js'
      - 'tests/vocabulary-diagnostic-stage2-student-readiness.test.js'
      - '.github/workflows/diagnostic-student-readiness.yml'
permissions:
  contents: read
jobs:
  student-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run diagnostic readiness regressions
        run: node --test tests/vocabulary-diagnostic-stage2-student-readiness.test.js
