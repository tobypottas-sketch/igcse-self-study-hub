name: Word Families TDD

on:
  push:
    branches:
      - feat/unit1-word-families-bank

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unit1-word-families-bank
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire Unit 1 Word Family supplement
        run: node scripts/wire-unit1-word-family-supplement.mjs
      - name: Commit wiring if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/vocabulary/units/unit-01.js
          if git diff --cached --quiet; then
            echo "Unit 1 supplement wiring already present."
          else
            git commit -m "content: wire Unit 1 Word Families supplement"
            git push origin HEAD:feat/unit1-word-families-bank
          fi
      - run: npm test
