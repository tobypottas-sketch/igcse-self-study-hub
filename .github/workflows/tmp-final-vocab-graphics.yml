name: Temporary Final Vocabulary Graphics
on:
  push:
    branches: [fix/vocabulary-png-graphics-merge]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[graphics final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch approved Canva artwork
        shell: bash
        run: |
          python -m pip install -q requests pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import requests,re,html,io
          sources = {
            'assets/vocabulary/units/unit-01.png':'https://www.canva.com/d/ZJlgbh4AURv3ozK',
            'assets/vocabulary/pathways/meaning.png':'https://www.canva.com/d/ZQtK3k-ZcL8IB3q',
            'assets/vocabulary/pathways/context.png':'https://www.canva.com/d/cPIV3pnZC_K-7sp',
            'assets/vocabulary/pathways/word-families.png':'https://www.canva.com/d/I9yI8HUkt5VAkJx',
            'assets/vocabulary/pathways/paraphrasing.png':'https://www.canva.com/d/coDUaX0VIEJ1rET',
            'assets/vocabulary/pathways/precision-use.png':'https://www.canva.com/d/vxYX14WxjkRE2X0',
            'assets/vocabulary/pathways/spelling-recall.png':'https://www.canva.com/d/FhV4lWCx8UdrUvp',
          }
          session=requests.Session(); session.headers['User-Agent']='Mozilla/5.0'
          for dest,share in sources.items():
            r=session.get(share,timeout=30); r.raise_for_status()
            m=(re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',r.text,re.I)
               or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',r.text,re.I))
            if not m: raise RuntimeError(f'No og:image for {share}')
            image_url=html.unescape(m.group(1))
            b=session.get(image_url,timeout=30); b.raise_for_status()
            im=Image.open(io.BytesIO(b.content)).convert('RGBA')
            target=(1672,411) if '/units/' in dest else (1024,1024)
            if im.size != target:
              im=im.resize(target,Image.Resampling.LANCZOS)
            p=Path(dest); p.parent.mkdir(parents=True,exist_ok=True)
            im.save(p,optimize=True)
            print(dest,im.size)
          PY
      - name: Add PNG graphics layer
        shell: bash
        run: |
          cat > src/vocabulary/graphics-manifest.js <<'EOF'
          export const VOCABULARY_GRAPHICS = Object.freeze({
            units:Object.freeze({
              '1':'../../assets/vocabulary/units/unit-01.png'
            }),
            pathways:Object.freeze({
              meaning:'../../assets/vocabulary/pathways/meaning.png',
              context:'../../assets/vocabulary/pathways/context.png',
              word_families:'../../assets/vocabulary/pathways/word-families.png',
              paraphrasing:'../../assets/vocabulary/pathways/paraphrasing.png',
              precision_use:'../../assets/vocabulary/pathways/precision-use.png',
              spelling_recall:'../../assets/vocabulary/pathways/spelling-recall.png'
            })
          });
          EOF
          cat > src/vocabulary/graphics-registry.js <<'EOF'
          import { VOCABULARY_GRAPHICS } from './graphics-manifest.js';
          const assetUrl = value => value ? new URL(value, import.meta.url).href : null;
          export function unitGraphic(unitNumber) { return assetUrl(VOCABULARY_GRAPHICS.units[String(unitNumber)]); }
          export function pathwayGraphic(pathwayId) { return assetUrl(VOCABULARY_GRAPHICS.pathways[String(pathwayId)]); }
          EOF
          cat > src/vocabulary/graphics-runtime.js <<'EOF'
          import { unitGraphic, pathwayGraphic } from './graphics-registry.js';
          function attach(container, src, kind) {
            if (!container || !src || container.querySelector(':scope > .vocab-png-art')) return;
            const image = new Image();
            image.className = `vocab-png-art vocab-png-art--${kind}`;
            image.alt = '';
            image.setAttribute('aria-hidden','true');
            image.decoding = 'async';
            image.addEventListener('load', () => container.classList.add('has-vocab-png-art'), { once:true });
            image.addEventListener('error', () => image.remove(), { once:true });
            container.append(image);
            image.src = src;
          }
          export function hydrateVocabularyGraphics(root = document) {
            root.querySelectorAll('[data-unit-art]').forEach(el => attach(el,unitGraphic(el.dataset.unitArt),'unit-card'));
            root.querySelectorAll('[data-unit-hero-art]').forEach(el => attach(el,unitGraphic(el.dataset.unitHeroArt),'unit-hero'));
            root.querySelectorAll('[data-pathway-art]').forEach(el => attach(el,pathwayGraphic(el.dataset.pathwayArt),'pathway'));
          }
          EOF
          cat > src/vocabulary/graphics-boot.js <<'EOF'
          import { hydrateVocabularyGraphics } from './graphics-runtime.js';
          function boot() {
            const root=document.querySelector('#vocabularyApp') ?? document.body;
            hydrateVocabularyGraphics(root);
            new MutationObserver(() => hydrateVocabularyGraphics(root)).observe(root,{childList:true,subtree:true});
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
          EOF
          cat > vocabulary-graphics.css <<'EOF'
          .vocab-unit-card__art,.vocab-unit-hero__art,.vocab-pathway-card__art{overflow:hidden}
          .vocab-png-art{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;z-index:2;pointer-events:none;transition:opacity .18s ease}
          .has-vocab-png-art>.vocab-png-art{opacity:1}
          .has-vocab-png-art>svg{opacity:0}
          .vocab-png-art--pathway{object-fit:contain;object-position:center}
          .vocab-png-art--unit-card{object-fit:cover;object-position:center}
          .vocab-png-art--unit-hero{object-fit:cover;object-position:right center}
          @media (prefers-reduced-motion:reduce){.vocab-png-art{transition:none}}
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('vocabulary.html'); s=p.read_text()
          if 'vocabulary-graphics.css' not in s:
            s=s.replace('</head>','  <link rel="stylesheet" href="./vocabulary-graphics.css">\n</head>')
          if 'graphics-boot.js' not in s:
            s=s.replace('</body>','  <script type="module" src="./src/vocabulary/graphics-boot.js"></script>\n</body>')
          p.write_text(s)
          PY
      - name: Verify assets and source
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          assert Image.open('assets/vocabulary/units/unit-01.png').size == (1672,411)
          for n in ['meaning','context','word-families','paraphrasing','precision-use','spelling-recall']:
            assert Image.open(f'assets/vocabulary/pathways/{n}.png').size == (1024,1024)
          assert 'vocabulary-graphics.css' in Path('vocabulary.html').read_text()
          assert 'graphics-boot.js' in Path('vocabulary.html').read_text()
          print('graphics verified')
          PY
          git diff --check
      - name: Run full tests
        run: npm test
      - name: Validate Unit 1
        run: node scripts/validate-vocabulary-content.mjs
      - name: Clean workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/tmp-final-vocab-graphics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: ship Vocabulary Builder PNG graphics [graphics final]'
          git push origin HEAD:fix/vocabulary-png-graphics-merge
