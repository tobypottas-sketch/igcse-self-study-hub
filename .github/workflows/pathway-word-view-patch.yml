name: One-shot pathway word view patch

on:
  push:
    branches: [fix/fixed-vocabulary-pathways]
    paths:
      - '.github/workflows/pathway-word-view-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fixed-vocabulary-pathways
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-vocab-pathway-word-view.mjs
      - run: npm test -- --test-name-pattern='all-words view renders all six pathway states for each word|one word can expose six independent pathway states'
      - name: Commit patched source and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show per-word fixed pathway progress"
          git push origin HEAD:fix/fixed-vocabulary-pathways
