name: Fix Vocabulary Session Finish Harness

on:
  push:
    branches:
      - feat/vocabulary-session-finish

permissions:
  contents: write

jobs:
  patch-harness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vocabulary-session-finish
      - name: Inject finish model into VM harness
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('tests/vocabulary-continue-history.test.js')
          text = path.read_text()
          anchor = "import { buildActivity } from '../src/vocabulary/activity-factory.js';\n"
          extra = "import { buildSessionFinishModel } from '../src/vocabulary/session-finish-model.js';\n"
          if extra not in text:
              text = text.replace(anchor, anchor + extra)
          old = "...sessions,...targets,...pathways,...placement,...engine,deriveLearningStage,buildSupportStep,\n"
          new = "...sessions,...targets,...pathways,...placement,...engine,deriveLearningStage,buildSupportStep,buildSessionFinishModel,\n"
          if old not in text:
              raise SystemExit('VM context injection anchor not found')
          text = text.replace(old,new,1)
          path.write_text(text)
          PY
      - name: Verify anti-repeat harness
        run: node --test tests/vocabulary-continue-history.test.js
      - name: Commit harness update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/vocabulary-continue-history.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: inject session finish model into continue harness'
          git push origin HEAD:feat/vocabulary-session-finish
