name: Apply approved pathway art fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pathway-art-evidence-lifecycle-merge-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved patch
        run: |
          for f in p00.b64 p01.b64 p02.b64 p03.b64 p04.b64 p05.b64 p06.b64 p07.b64 p08.b64 p09.b64 p10.b64 p11.b64; do
            git show "origin/main:.review-payload-pathway/$f"
          done | base64 -d | gzip -d > /tmp/pathway-art-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/pathway-art-fix.patch
      - name: Run full test suite
        run: npm test
      - name: Remove feature-branch staging files
        run: |
          git rm -r .review-payload .github/workflows/apply-pathway-art-fix.yml
          git commit -m "Remove temporary pathway fix staging files"
          git push origin HEAD:fix/pathway-art-evidence-lifecycle-merge-2
