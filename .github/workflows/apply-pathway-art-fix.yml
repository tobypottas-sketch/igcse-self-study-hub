name: Apply approved pathway art fix

on:
  push:
    branches:
      - fix/pathway-art-evidence-lifecycle-merge-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pathway-art-evidence-lifecycle-merge-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved patch
        run: |
          base64 -d .review-payload/pathway-art-fix.patch.gz.b64 | gzip -d > /tmp/pathway-art-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/pathway-art-fix.patch
      - name: Run full test suite
        run: npm test
      - name: Remove temporary staging files
        run: |
          git rm .review-payload/pathway-art-fix.patch.gz.b64 .github/workflows/apply-pathway-art-fix.yml
          git commit -m "Remove temporary pathway fix staging files"
          git push origin HEAD:fix/pathway-art-evidence-lifecycle-merge-2
