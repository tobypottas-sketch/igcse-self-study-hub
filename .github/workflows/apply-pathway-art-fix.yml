name: Apply approved pathway art fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pathway-art-evidence-lifecycle-merge-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved patch
        run: |
          cat .review-payload/p00.b64 .review-payload/p01.b64 .review-payload/p02.b64 .review-payload/p03.b64 .review-payload/p04.b64 .review-payload/p05.b64 .review-payload/p06.b64 .review-payload/p07.b64 .review-payload/p08.b64 .review-payload/p09.b64 .review-payload/p10.b64 .review-payload/p11.b64 | base64 -d | gzip -d > /tmp/pathway-art-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/pathway-art-fix.patch
      - name: Run full test suite
        run: npm test
      - name: Remove temporary staging files
        run: |
          git rm -r .review-payload .github/workflows/apply-pathway-art-fix.yml
          git commit -m "Remove temporary pathway fix staging files"
          git push origin HEAD:fix/pathway-art-evidence-lifecycle-merge-2
