name: Login password visibility QA
on:
  pull_request:
    paths:
      - "src/views/login.js"
      - "src/app.js"
      - "styles.css"
      - "tests/login-password-visibility.test.js"
      - ".github/workflows/login-password-visibility-qa.yml"
  push:
    branches: [main]
    paths:
      - "src/views/login.js"
      - "src/app.js"
      - "styles.css"
      - "tests/login-password-visibility.test.js"
      - ".github/workflows/login-password-visibility-qa.yml"
jobs:
  login-visibility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check login visibility and authentication regressions
        run: node --test tests/login-password-visibility.test.js tests/auth-flow.test.js
