name: Teacher class access security
on:
  pull_request:
    paths:
      - "src/reporting/**"
      - "tests/student-progress-reporting.test.js"
      - "src/app.js"
      - "src/views/home.js"
      - "src/views/admin.js"
      - "tests/student-table-numbering.test.js"
      - "src/admin/credential-print.js"
      - "tests/admin-class-roster-ux.test.mjs tests/student-table-numbering.test.js"
      - "src/admin/import.js"
      - "tests/admin-import.test.js"
      - "tests/admin-import-view.test.js"
      - "supabase/functions/admin-class-action/**"
      - "supabase/functions/admin-provision-user/**"
      - "supabase/sql/hotfix-**"
      - "tests/teacher-class-access-hotfix.test.js"
      - "tests/teacher-student-password-reset.test.js"
      - "src/vocabulary/teacher-password-manager.js"
      - "src/vocabulary/teacher-login-cards.js"
      - "tests/teacher-class-login-cards.test.js"
      - "tests/admin-class-assignment-roles.test.js"
      - ".github/workflows/teacher-class-access-security.yml"
  push:
    branches: [main]
    paths:
      - "src/app.js"
      - "src/views/home.js"
      - "src/views/admin.js"
      - "tests/student-table-numbering.test.js"
      - "src/admin/credential-print.js"
      - "tests/admin-class-roster-ux.test.mjs"
      - "src/admin/import.js"
      - "tests/admin-import.test.js"
      - "tests/admin-import-view.test.js"
      - "supabase/functions/admin-class-action/**"
      - "supabase/functions/admin-provision-user/**"
      - "supabase/sql/hotfix-**"
      - "tests/teacher-class-access-hotfix.test.js"
      - "tests/teacher-student-password-reset.test.js"
      - "src/vocabulary/teacher-password-manager.js"
      - "tests/admin-class-assignment-roles.test.js"
      - ".github/workflows/teacher-class-access-security.yml"
jobs:
  authorization-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run class/admin authorization regressions
        run: node --test tests/teacher-class-access-hotfix.test.js tests/admin-class-assignment-roles.test.js tests/admin-class-rename-backend.test.js tests/admin-view.test.js tests/teacher-student-password-reset.test.js tests/admin-import.test.js tests/admin-import-view.test.js tests/admin-class-roster-ux.test.mjs tests/teacher-class-login-cards.test.js tests/admin-provision-validation.test.js tests/app-state.test.js tests/admin-activity-data.test.js tests/home-merit-alert.test.js tests/teacher-activity-security.test.mjs tests/merit-pathways-per-class.test.js tests/student-progress-reporting.test.js tests/admin-activity-model.test.js tests/admin-activity-list-navigation.test.mjs tests/vocabulary-teacher-data.test.js
  activity-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run synthetic Activity browser regressions
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node --test tests/admin-activity-ui-consolidation.test.js
