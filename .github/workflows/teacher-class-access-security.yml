name: Teacher class access security
on:
  pull_request:
    paths:
      - "src/app.js"
      - "src/views/home.js"
      - "src/views/admin.js"
      - "src/admin/credential-print.js"
      - "tests/admin-class-roster-ux.test.mjs"
      - "src/admin/import.js"
      - "tests/admin-import.test.js"
      - "tests/admin-import-view.test.js"
      - "supabase/functions/admin-class-action/**"
      - "supabase/functions/admin-provision-user/**"
      - "supabase/sql/hotfix-**"
      - "tests/teacher-class-access-hotfix.test.js"
      - "tests/teacher-student-password-reset.test.js"
      - "src/vocabulary/teacher-password-manager.js"
      - "tests/admin-class-assignment-roles.test.js"
      - ".github/workflows/teacher-class-access-security.yml"
  push:
    branches: [main]
    paths:
      - "src/app.js"
      - "src/views/home.js"
      - "src/views/admin.js"
      - "src/admin/credential-print.js"
      - "tests/admin-class-roster-ux.test.mjs"
      - "src/admin/import.js"
      - "tests/admin-import.test.js"
      - "tests/admin-import-view.test.js"
      - "supabase/functions/admin-class-action/**"
      - "supabase/functions/admin-provision-user/**"
      - "supabase/sql/hotfix-**"
      - "tests/teacher-class-access-hotfix.test.js"
      - "tests/teacher-student-password-reset.test.js"
      - "src/vocabulary/teacher-password-manager.js"
      - "tests/admin-class-assignment-roles.test.js"
      - ".github/workflows/teacher-class-access-security.yml"
jobs:
  authorization-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run class/admin authorization regressions
        run: node --test tests/teacher-class-access-hotfix.test.js tests/admin-class-assignment-roles.test.js tests/admin-class-rename-backend.test.js tests/admin-view.test.js tests/teacher-student-password-reset.test.js tests/admin-import.test.js tests/admin-import-view.test.js tests/admin-class-roster-ux.test.mjs
