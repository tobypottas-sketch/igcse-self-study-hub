name: Probe original Canva resolution (temporary)
on:
  push:
    branches: [fix/shop-stall-hires-wallet-spacing-20261121]
    paths: ['.github/workflows/temp-stall-image-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test signed Canva image URL variants
        env:
          SOURCE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Fcc0b00e0-a33d-4c6b-a074-1f58f07a5b7d/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADhFAU2tg-m9LV3_J8CZK7Mjv9bapnAHfDggc__cEz3S&exp=1795281626&osig=AAAAAAAAAAAAAAAAAAAAADDiPMgvX6IYSr07AZHztTnrpJBm-phte6IuLU8ta5Fl&signer=media-rpc&token=AAIAAU0AJGNjMGIwMGUwLWEzM2QtNGM2Yi1hMDc0LTFmNThmMDdhNWI3ZAAAAAABof8fo5AlVuLO29j86NyrY-f3kmtItKqW5A-uBmz0M_41x2zYng&x-canva-quality=thumbnail"
        run: |
          python3 - <<'PY'
          import os, urllib.request,urllib.error,urllib.parse,re,struct
          from pathlib import Path
          signed=os.environ["SOURCE_URL"]
          parsed=urllib.parse.urlsplit(signed)
          q=urllib.parse.parse_qs(parsed.query)
          direct='https://media.canva.com/ifs/M/cc0b00e0-a33d-4c6b-a074-1f58f07a5b7d'
          changes=[
            ('signed-thumbnail',signed),
            ('same-signature-1448',signed.replace('/height:150/','/height:1086/').replace('/width:200','/width:1448')),
            ('same-signature-1448-no-quality',signed.replace('/height:150/','/height:1086/').replace('/width:200','/width:1448').replace('&x-canva-quality=thumbnail','')),
            ('direct-ifs',direct),
            ('direct-ifs-token',direct+'?token='+q['token'][0]),
            ('direct-ifs-all-query',direct+'?'+parsed.query),
            ('resize-no-dim',signed.replace('/height:150','').replace('/width:200','')),
            ('resize-original-dims-no-watermark',signed.replace('/height:150/','/height:1086/').replace('/width:200','/width:1448').replace('/watermark:F','')),
            ('resize-1448-200-path',signed.replace('/height:150/','/height:1086/').replace('/width:200','/width:1448').replace('x-canva-quality=thumbnail','x-canva-quality=original')),
          ]
          for name,url in changes:
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=12) as resp:
                data=resp.read(5000000)
                size=struct.unpack('>II',data[16:24]) if data[:8]==bytes.fromhex('89504e470d0a1a0a') else None
                print(name,resp.status,len(data),size,resp.headers.get('Content-Type'),flush=True)
                if size and size[0]>500:
                  Path('/tmp/stall-original.png').write_bytes(data)
            except urllib.error.HTTPError as exc:
              print(name,'HTTP',exc.code,flush=True)
            except Exception as exc:
              print(name,type(exc).__name__,str(exc)[:140],flush=True)
          PY
