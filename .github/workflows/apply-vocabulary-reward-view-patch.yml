name: Apply vocabulary reward view patch

on:
  push:
    branches: [fix/vocabulary-session-reward-loop]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vocabulary-session-reward-loop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-vocabulary-reward-view-patch.mjs
      - run: node --test tests/vocabulary-session-completion-view.test.js
      - name: Commit patched view when changed
        run: |
          if git diff --quiet -- src/vocabulary/views.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary/views.js
          git commit -m "feat: add vocabulary completion screens"
          git push origin HEAD:fix/vocabulary-session-reward-loop
