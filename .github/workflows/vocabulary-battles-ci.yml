name: Vocabulary Class Battles MVP
on:
  pull_request:
    paths:
      - 'supabase/functions/vocabulary-battles/**'
      - 'supabase/migrations/*vocabulary_class_battles.sql'
      - 'src/vocabulary/battles-app.js'
      - 'src/vocabulary/views.js'
      - 'vocabulary-battles.*'
      - 'tests/vocabulary-battles.test.js'
      - '.github/workflows/vocabulary-battles-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/vocabulary-battles/**'
      - 'supabase/migrations/*vocabulary_class_battles.sql'
      - 'src/vocabulary/battles-app.js'
      - 'vocabulary-battles.*'
      - 'tests/vocabulary-battles.test.js'
jobs:
  safety-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone arena JavaScript
        run: node --check src/vocabulary/battles-app.js
      - name: Verify battle safety and content
        run: node --test tests/vocabulary-battles.test.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated Battle server
        run: deno check --node-modules-dir=auto supabase/functions/vocabulary-battles/index.ts
