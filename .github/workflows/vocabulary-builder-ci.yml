name: Vocabulary Builder CI
on:
  push:
    branches: [design/vocabulary-paraphrase-builder, fix/vocabulary-preview-module-20261017]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/validate-vocabulary-content.mjs
