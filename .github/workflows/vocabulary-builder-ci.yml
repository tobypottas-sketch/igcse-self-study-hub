name: Vocabulary Builder CI
on:
  push:
    branches: [main, design/vocabulary-paraphrase-builder, design/0511-vocabulary-activity-redesign-20261017, 'fix/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/vocabulary-unit-06-check.test.js
