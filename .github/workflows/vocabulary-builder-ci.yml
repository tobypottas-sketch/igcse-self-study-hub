name: Vocabulary Builder CI
on:
  push:
    branches: [main, design/vocabulary-paraphrase-builder, design/0511-vocabulary-activity-redesign-20261017, 'fix/**']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reward summary view patch
        if: github.ref_name == 'fix/vocabulary-session-reward-loop' && github.event.head_commit.message == 'chore: run reward patch v2'
        run: node scripts/apply-vocabulary-reward-view-patch.mjs
      - name: Commit reward summary view patch
        if: github.ref_name == 'fix/vocabulary-session-reward-loop' && github.event.head_commit.message == 'chore: run reward patch v2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary/views.js
          git commit -m "feat: add vocabulary completion screens"
          git push origin HEAD:fix/vocabulary-session-reward-loop
      - run: npm test
      - name: Verify Vocabulary metadata against PostgreSQL constraints
        env:
          PGPASSWORD: postgres
        run: |
          node scripts/verify-vocabulary-metadata-contract.mjs > /tmp/vocabulary-metadata-contract.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f /tmp/vocabulary-metadata-contract.sql
      - run: node scripts/validate-vocabulary-content.mjs
      - name: Verify Unit 1 publish export scope
        shell: bash
        run: |
          node scripts/export-vocabulary-sql.mjs content/vocabulary/releases/unit-01.js > /tmp/unit-01.sql
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sql = fs.readFileSync('/tmp/unit-01.sql','utf8').toLowerCase();
          const inserts = [...sql.matchAll(/insert into public\.([a-z0-9_]+)/g)].map(match => match[1]);
          const allowed = new Set(['vocabulary_items','vocabulary_unit_occurrences','vocabulary_contexts','vocabulary_unit_activities']);
          const unexpected = [...new Set(inserts.filter(name => !allowed.has(name)))];
          if (!inserts.length || unexpected.length) throw new Error(`Unexpected publish tables: ${unexpected.join(', ') || 'no inserts found'}`);
          if (/\b(delete|truncate|drop|alter)\b/.test(sql)) throw new Error('Export contains destructive DDL/DML.');
          if (!inserts.includes('vocabulary_unit_activities')) throw new Error('Unit 1 activity bank is missing from export.');
          console.log('Unit 1 export touches only curated vocabulary content tables:', [...new Set(inserts)].join(', '));
          NODE
