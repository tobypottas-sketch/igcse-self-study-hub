name: Vocabulary Builder CI
on:
  push:
    branches: [design/vocabulary-paraphrase-builder, design/0511-vocabulary-activity-redesign-20261017]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests with concise failure output
        shell: bash
        run: |
          set +e
          npm test > /tmp/vocab-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -E -B 8 -A 24 'not ok|AssertionError|ERR_ASSERTION|Error \[' /tmp/vocab-test.log | head -n 160 || true
            tail -n 18 /tmp/vocab-test.log
            exit "$status"
          fi
          tail -n 25 /tmp/vocab-test.log
      - run: node scripts/validate-vocabulary-content.mjs
