name: Vocabulary Stage 2 Cleanup
on:
  push:
    branches: ['fix/vocabulary-stage2-match-cards']
permissions:
  contents: write
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-stage2-temp]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vocabulary-stage2-match-cards
          fetch-depth: 0
      - name: Remove temporary implementation scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/vocabulary-stage2-apply-patch.yml .github/workflows/vocabulary-stage2-diagnostic.yml docs/.stage2-match-patch-trigger
          git commit -m "chore: remove temporary Stage 2 implementation scaffolding"
          git push origin HEAD:fix/vocabulary-stage2-match-cards
