name: System Audit
on:
  push:
    branches: [main, fix/system-audit-20261014, fix/third-hardening-audit-20261014, audit/ninth-hardening-20261016]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
