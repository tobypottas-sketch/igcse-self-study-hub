name: System Audit
on:
  push:
    branches: [main, fix/system-audit-20261014]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-system-audit-wiring.mjs
      - run: node --test tests/*.test.mjs
      - name: Commit generated wiring fixes
        run: |
          if git diff --quiet -- src/tracking; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tracking
          git commit -m "fix: harden cross-app Hub wiring"
          git push
