name: Vocabulary Debug Test Output

on:
  push:
    branches:
      - fix/fixed-vocabulary-pathways

jobs:
  debug-test-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture node test output
        shell: bash
        run: |
          set +e
          npm test > vocabulary-test-output.txt 2>&1
          status=$?
          echo "TEST_EXIT_CODE=$status" >> vocabulary-test-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: vocabulary-test-output
          path: vocabulary-test-output.txt
          if-no-files-found: error
