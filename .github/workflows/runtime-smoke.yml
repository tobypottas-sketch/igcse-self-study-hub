name: Runtime Smoke
on:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: write
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reward summary view patch
        if: github.ref_name == 'fix/vocabulary-session-reward-loop' && github.event.head_commit.message == 'chore: apply reward summary patch via runtime smoke'
        run: node scripts/apply-vocabulary-reward-view-patch.mjs
      - name: Commit reward summary view patch
        if: github.ref_name == 'fix/vocabulary-session-reward-loop' && github.event.head_commit.message == 'chore: apply reward summary patch via runtime smoke'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vocabulary/views.js
          git commit -m "feat: add vocabulary completion screens"
          git push origin HEAD:fix/vocabulary-session-reward-loop
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install chromium
      - name: Start local Hub
        run: python3 -m http.server 4173 >/tmp/igcse-hub-http.log 2>&1 &
      - run: npx playwright test tests/runtime-smoke.spec.mjs --reporter=line
