name: Apply Meaning Match Patch

on:
  push:
    branches:
      - feat/meaning-match-pairing-merge

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[meaning-match-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/meaning-match-pairing-merge

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconstruct approved replacement patch
        run: |
          cat .merge-staging/p00 .merge-staging/p01 .merge-staging/p02 .merge-staging/p03 .merge-staging/p04 .merge-staging/p05 .merge-staging/p06 .merge-staging/p07 > /tmp/patch.b64
          base64 -d /tmp/patch.b64 | gunzip > /tmp/meaning-match.patch
          git am /tmp/meaning-match.patch

      - name: Run full test suite
        run: npm test

      - name: Remove temporary staging and workflow
        run: |
          rm -rf .merge-staging
          rm -f .github/workflows/apply-meaning-match-patch.yml
          git add -A
          git commit -m "chore: remove temporary merge staging [meaning-match-applied]"

      - name: Push final branch
        run: git push origin HEAD:feat/meaning-match-pairing-merge
