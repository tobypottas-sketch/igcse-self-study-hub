name: Writing assessor prototype checks
on:
  push:
    paths:
      - 'assessor-prototype/**'
      - 'src/assessor/**'
      - 'tests/teacher-writing-assessor*'
      - 'tests/student-writing-feedback*'
      - 'student-feedback.css'
      - 'supabase/migrations/20261107150000_student_feedback_quota.sql'
      - 'assessor.css'
      - 'assessment-progress.css'
      - '.github/workflows/assessor-prototype-tests.yml'
  pull_request:
    paths:
      - 'assessor-prototype/**'
      - 'src/assessor/**'
      - 'tests/teacher-writing-assessor*'
      - 'tests/student-writing-feedback*'
      - 'student-feedback.css'
      - 'supabase/migrations/20261107150000_student_feedback_quota.sql'
      - 'assessor.css'
      - 'assessment-progress.css'
      - '.github/workflows/assessor-prototype-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assessor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Worker, staff-auth, deployment-plan, Hub client and contract tests
        run: node --test assessor-prototype/*.test.mjs tests/teacher-writing-assessor*.test.mjs tests/student-writing-feedback.test.mjs
