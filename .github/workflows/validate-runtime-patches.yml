name: Validate runtime patches

on:
  push:
    branches: [fix/vocabulary-runtime-stage]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild approved patches
        run: |
          cat .review-payload/0001.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/0001.patch
          cat .review-payload/0002.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/0002.patch
          cat .review-payload/0003.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/0003.patch
      - name: Apply approved patches
        run: |
          git apply /tmp/0001.patch
          git apply /tmp/0002.patch
          git apply /tmp/0003.patch
      - name: Test
        run: npm test
      - name: Package changed files
        run: |
          mkdir -p runtime-result
          git diff --name-only d14d6cf652dd4a5e3bd080ce0117fac288f9ca90 -- ':!.review-payload/**' ':!.github/workflows/validate-runtime-patches.yml' > runtime-result/changed-files.txt
          while IFS= read -r p; do mkdir -p "runtime-result/$(dirname "$p")"; cp "$p" "runtime-result/$p"; done < runtime-result/changed-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-patch-result
          path: runtime-result
