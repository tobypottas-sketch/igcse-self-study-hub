name: Validate runtime patches

on:
  push:
    branches: [fix/vocabulary-runtime-stage]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild approved patches
        run: |
          cat .review-payload/runtime-01-* | base64 -d | gzip -d > /tmp/0001.patch
          cat .review-payload/runtime-02-* | base64 -d | gzip -d > /tmp/0002.patch
          cat .review-payload/runtime-03-* | base64 -d | gzip -d > /tmp/0003.patch
      - name: Apply approved patches
        run: |
          git apply /tmp/0001.patch
          git apply /tmp/0002.patch
          git apply /tmp/0003.patch
      - name: Test
        run: npm test
      - name: Package changed files
        run: |
          mkdir -p runtime-result
          git diff --name-only d14d6cf652dd4a5e3bd080ce0117fac288f9ca90 > runtime-result/changed-files.txt
          while IFS= read -r p; do mkdir -p "runtime-result/$(dirname "$p")"; cp "$p" "runtime-result/$p"; done < runtime-result/changed-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-patch-result
          path: runtime-result
