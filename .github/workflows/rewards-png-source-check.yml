name: Reward PNG source feasibility
on:
  pull_request:
    paths:
      - '.github/workflows/rewards-png-source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-image-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check temporary high-resolution media asset
        env:
          ART: 'https://media.canva.com/v2/image-resize/format:PNG/height:580/quality:100/uri:ifs%3A%2F%2FM%2F27bcdaeb-8c9a-4b0a-8b02-ae0884c41ab3/watermark:F/width:1360?csig=AAAAAAAAAAAAAAAAAAAAAHa0S9gYqr9SBpCKwmFH4pvjhLRVIT8zfR4__bdUpvSl&exp=1794984548&osig=AAAAAAAAAAAAAAAAAAAAALCvUkzPcuoo_exBZa0i_Z9-o91NzwQbRCIn0Lb-evOp&signer=media-rpc&token=AAIAAU0AJDI3YmNkYWViLThjOWEtNGIwYS04YjAyLWFlMDg4NGM0MWFiMwAAAAABoe1qlqCssQ2OmVrZbWRs4XeJ7zPzpDqNjtXyhXFMuo90PvvQag&x-canva-quality=thumbnail'
        run: |
          curl --retry 2 -L --silent --show-error --fail "$ART" -o /tmp/hero.png
          file /tmp/hero.png
          python - <<'PY'
          import struct
          b=open('/tmp/hero.png','rb').read(32)
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          print("PNG DIMENSIONS",struct.unpack(">II",b[16:24]))
          PY
