name: Materialize Unit 1 Batch 3

on:
  push:
    branches:
      - content/unit1-language-bank-batch3-final

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Decode reviewed patches
        run: |
          base64 -d .review-payload/batch3-base.patch.gz.b64 | gzip -d > /tmp/batch3-base.patch
          base64 -d .review-payload/batch3-final-revision.patch.gz.b64 | gzip -d > /tmp/batch3-revision.patch
      - name: Apply reviewed Batch 3 patches
        run: |
          git am /tmp/batch3-base.patch
          git am /tmp/batch3-revision.patch
      - name: Verify focused checks
        run: |
          node --check content/vocabulary/units/unit-01-language-bank.js
          node --test tests/vocabulary-unit1-obvious-answer-solver.test.js
      - name: Remove staging payload and one-shot workflow
        run: |
          git rm -r .review-payload
          git rm .github/workflows/materialize-unit1-batch3.yml
          git commit -m "Remove Batch 3 review staging"
      - name: Push materialized Batch 3 branch
        run: git push origin HEAD:content/unit1-language-bank-batch3-final
