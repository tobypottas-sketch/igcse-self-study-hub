name: Apply approved Next Question latency fix

on:
  push:
    branches:
      - fix/next-question-latency-merge

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/next-question-latency-merge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved replacement patch
        run: |
          base64 -d .merge-staging/next-latency.patch.gz.b64 | gzip -d > /tmp/next-latency.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/next-latency.patch
      - name: Run full test suite
        run: npm test
      - name: Remove temporary staging and workflow, then push branch
        run: |
          git rm -r .merge-staging .github/workflows/apply-next-latency-fix.yml
          git commit -m "Remove temporary latency merge staging"
          git push origin HEAD:fix/next-question-latency-merge
