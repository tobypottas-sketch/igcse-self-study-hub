name: First Attempt Analytics

on:
  push:
    branches:
      - feat/teacher-activity-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/teacher-activity-first-attempt.test.js tests/activity-view.test.js tests/activity-student-view.test.js
