name: Materialize Unit 1 review content

on:
  push:
    branches:
      - content/unit1-language-bank-review
    paths:
      - .github/workflows/materialize-unit1-review.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/vocabulary/units tests
          cat .review-payload/bank.part* | base64 -d | gzip -dc > content/vocabulary/units/unit-01-language-bank.js
          cat .review-payload/solver.part* | base64 -d | gzip -dc > tests/vocabulary-unit1-obvious-answer-solver.test.js
          node --check content/vocabulary/units/unit-01-language-bank.js
          node --check tests/vocabulary-unit1-obvious-answer-solver.test.js
          rm -rf .review-payload
      - name: Commit reconstructed review state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/vocabulary/units/unit-01-language-bank.js tests/vocabulary-unit1-obvious-answer-solver.test.js .review-payload
          git commit -m "Add reviewed Unit 1 language bank batches 1-2"
          git push origin HEAD:content/unit1-language-bank-review
