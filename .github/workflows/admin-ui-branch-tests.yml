name: Admin UI Branch Tests

on:
  push:
    branches:
      - feat/teacher-activity-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/admin-view.test.js
