name: Diagnostic pilot readiness panel
on:
  pull_request:
    paths:
      - 'src/vocabulary/diagnostic-pilot-readiness.js'
      - 'src/vocabulary/diagnostic-review.js'
      - 'tests/vocabulary-diagnostic-pilot-readiness-panel.test.js'
      - '.github/workflows/diagnostic-pilot-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'src/vocabulary/diagnostic-pilot-readiness.js'
      - 'src/vocabulary/diagnostic-review.js'
      - 'tests/vocabulary-diagnostic-pilot-readiness-panel.test.js'
      - '.github/workflows/diagnostic-pilot-readiness.yml'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run staff pilot readiness tests
        run: node --test tests/vocabulary-diagnostic-pilot-readiness-panel.test.js
