name: Vocabulary Rewards Shop QA
on:
  pull_request:
    paths:
      - 'src/vocabulary/rewards-*.js'
      - 'src/vocabulary/engagement-model.js'
      - 'src/vocabulary/app.js'
      - 'src/vocabulary/views.js'
      - 'supabase/functions/vocabulary-reward-*/**'
      - 'docs/vocabulary-rewards/**'
      - 'tests/vocabulary-rewards-*.test.js'
      - 'vocabulary-rewards.css'
      - 'vocabulary.html'
      - '.github/workflows/vocabulary-rewards-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reward-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reward catalogue, XP parity fixtures and safe API contract
        run: node --test tests/vocabulary-rewards-*.test.js
