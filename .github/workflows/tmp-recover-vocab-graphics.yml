name: Recover Exact Vocabulary PNG Graphics

on:
  push:
    branches:
      - fix/vocabulary-png-graphics-recovery

permissions:
  contents: write

jobs:
  recover-integrate-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan retained git history for archive parts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== commits touching archive-01.part ==='
          git log --all --oneline -- .staging/archive-01.part || true
          echo '=== objects named archive-01.part ==='
          git rev-list --objects --all | grep -F '.staging/archive-01.part' || true
          echo '=== commits touching all archive parts ==='
          git log --all --name-status --format='COMMIT %H %s' -- .staging/archive-0*.part | grep -E '^(COMMIT|[AMD]\s)' || true
          echo '=== any staging objects containing archive-01 ==='
          git rev-list --objects --all | grep -E 'archive-01|final-int|patch[12]\.patch' || true
          echo '=== retained staging files on PNG-related remote refs ==='
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -E 'vocabulary-png|stage/vocabulary-png|recovery/vocabulary-png'); do
            echo "REF $ref"
            git ls-tree -r --name-only "$ref" .staging 2>/dev/null | sed 's/^/  /' || true
          done
          exit 1
