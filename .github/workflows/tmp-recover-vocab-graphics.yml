name: Recover Exact Vocabulary PNG Graphics

on:
  push:
    branches:
      - fix/vocabulary-png-graphics-recovery

permissions:
  contents: write

jobs:
  recover-integrate-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan retained graphics payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, re, struct, subprocess

          rows = subprocess.check_output(['git','rev-list','--objects','--all'], text=True).splitlines()
          seen=set()
          for row in rows:
              parts=row.split(' ',1)
              if len(parts)!=2: continue
              oid,path=parts
              if oid in seen: continue
              if not (path.endswith('.b64') or '/graphics-data/' in path or path.endswith('.part')): continue
              seen.add(oid)
              try:
                  raw=subprocess.check_output(['git','cat-file','blob',oid])
              except subprocess.CalledProcessError:
                  continue

              candidates=[]
              # whole-file base64 after stripping transport noise
              cleaned=re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
              if len(cleaned)>=100:
                  candidates.append(('whole-clean', cleaned))
              # quoted/data URI base64 strings inside JS/text
              for m in re.finditer(rb'(?:base64,)?([A-Za-z0-9+/]{100,}={0,2})', raw):
                  candidates.append(('embedded', m.group(1)))

              found=[]
              for kind,b64 in candidates:
                  try:
                      # avoid false padding failures on transport chunks
                      data=base64.b64decode(b64 + b'='*((-len(b64))%4), validate=False)
                  except Exception:
                      continue
                  sig=data.find(b'\x89PNG\r\n\x1a\n')
                  if sig<0 or len(data)<sig+26: continue
                  try:
                      w,h=struct.unpack('>II', data[sig+16:sig+24])
                  except Exception:
                      continue
                  complete=data.rfind(b'IEND')>=sig
                  found.append((kind,w,h,len(data),sig,complete))
              if found:
                  uniq=[]
                  for item in found:
                      if item not in uniq: uniq.append(item)
                  print(f'{oid} {path} raw={len(raw)} -> {uniq}')
          PY
          echo '=== all historical staging/base64 paths ==='
          git rev-list --objects --all | grep -E '(\.staging/|graphics-data/).*(\.b64|\.part|\.js)$' | sort -k2 || true
          exit 1
