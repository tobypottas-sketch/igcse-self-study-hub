name: Recover Exact Vocabulary PNG Graphics

on:
  push:
    branches:
      - fix/vocabulary-png-graphics-recovery

permissions:
  contents: write

jobs:
  recover-integrate-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan exact historical PNG candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, binascii, re, struct, subprocess

          rows=subprocess.check_output(['git','rev-list','--objects','--all'],text=True).splitlines()
          path_to=[]
          for row in rows:
              p=row.split(' ',1)
              if len(p)==2: path_to.append((p[0],p[1]))

          def first_blob(path):
              for oid,p in path_to:
                  if p==path:
                      return subprocess.check_output(['git','cat-file','blob',oid])
              return None

          def clean(raw): return re.sub(rb'[^A-Za-z0-9+/=]',b'',raw or b'')

          def png_info(data):
              sig=b'\x89PNG\r\n\x1a\n'
              if not data.startswith(sig) or len(data)<26: return None
              w,h=struct.unpack('>II',data[16:24])
              color_type=data[25]
              p=8
              valid=True; iend=False
              while p+12<=len(data):
                  n=struct.unpack('>I',data[p:p+4])[0]
                  typ=data[p+4:p+8]
                  end=p+12+n
                  if end>len(data): valid=False; break
                  payload=data[p+8:p+8+n]
                  stored=struct.unpack('>I',data[p+8+n:p+12+n])[0]
                  actual=binascii.crc32(typ+payload)&0xffffffff
                  if stored!=actual: valid=False; break
                  p=end
                  if typ==b'IEND': iend=True; break
              return (w,h,color_type,valid,iend,p==len(data) if iend else False,len(data))

          print('=== intact PNG blobs in all reachable history ===')
          seen=set()
          for oid,path in path_to:
              if oid in seen: continue
              seen.add(oid)
              try:
                  raw=subprocess.check_output(['git','cat-file','blob',oid])
              except Exception:
                  continue
              info=png_info(raw)
              if info and (info[0:2] in [(1024,1024),(1672,411)] or '/vocabulary/' in path):
                  print(oid,path,info)

          print('=== base64 PNG starts ===')
          starts={}
          for path in ['.staging/paraphrasing.b64','.staging/context.b64']:
              raw=first_blob(path)
              if raw is None: continue
              runs=re.findall(rb'[A-Za-z0-9+/]{100,}={0,2}',raw)
              found=None
              for r in sorted(runs,key=len,reverse=True):
                  try: d=base64.b64decode(r+b'='*((-len(r))%4),validate=False)
                  except Exception: continue
                  if d.startswith(b'\x89PNG\r\n\x1a\n'):
                      found=r; break
              if found is None:
                  c=clean(raw)
                  try: d=base64.b64decode(c+b'='*((-len(c))%4),validate=False)
                  except Exception: d=b''
                  if d.startswith(b'\x89PNG\r\n\x1a\n'): found=c
              if found is not None:
                  starts[path]=found
                  d=base64.b64decode(found+b'='*((-len(found))%4),validate=False)
                  print(path,'b64len',len(found),'decoded',len(d),'info',png_info(d))
              else:
                  print(path,'NO PNG START FOUND rawlen',len(raw))

          cont=[]
          for n in ('02','03','04','05'):
              raw=first_blob(f'.staging/archive-{n}.part')
              if raw is None: continue
              c=clean(raw)
              cont.append(c)
              print('archive-'+n,'clean b64len',len(c),'first',c[:12],'last',c[-12:])

          print('=== exact concatenation candidates ===')
          for path,start in starts.items():
              candidate=start+b''.join(cont)
              print(path,'candidate b64len',len(candidate),'mod4',len(candidate)%4)
              for trim in range(4):
                  c=candidate[:-trim] if trim else candidate
                  if len(c)%4: continue
                  try: data=base64.b64decode(c,validate=True)
                  except Exception as exc:
                      print(' decode failed trim',trim,exc); continue
                  print(' trim',trim,'decoded',len(data),'info',png_info(data))

          print('=== all staging payload paths ===')
          for oid,path in path_to:
              if '.staging/' in path or 'graphics-data/' in path:
                  if any(x in path for x in ('.b64','.part','.png','.js')):
                      print(oid,path)
          PY
          exit 1
