name: Microsoft pilot local Auth
on:
  pull_request:
    paths:
      - '.github/workflows/microsoft-pilot-auth.yml'
      - 'src/microsoft-sign-in.js'
      - 'src/views/login.js'
      - 'tests/microsoft-staff-sign-in.test.js'
      - 'supabase/migrations/20261126160000_microsoft_pilot_signup_hook.sql'
      - 'supabase/migrations/20261127025357_microsoft_student_pilot.sql'
permissions:
  contents: read
jobs:
  local-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: '2.118.0'
      - name: Start isolated Auth and database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pilot-auth"
          cd "$RUNNER_TEMP/pilot-auth"
          supabase init
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("supabase/config.toml")
          s = p.read_text()
          s = re.sub(r'(?m)^\[auth\.hook\.before_user_created\][^\n]*\n(?:[^\[]|\[(?![a-z]))*', '', s)
          s += '\n[auth.hook.before_user_created]\nenabled = true\nuri = "pg-functions://postgres/public/microsoft_pilot_before_user_created"\n'
          p.write_text(s)
          PY
          mkdir -p supabase/migrations
          printf '%s\n' 'create table public.profiles (id uuid primary key references auth.users(id), school_email text, role text, active boolean, must_change_password boolean);' > supabase/migrations/20261126000000_fixture.sql
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261126160000_microsoft_pilot_signup_hook.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261127025357_microsoft_student_pilot.sql" supabase/migrations/
          supabase start
          supabase status -o json > "$RUNNER_TEMP/pilot-auth-status.json"
      - name: Exercise real Auth password API and identity guards
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pilot-auth"
          export PGPASSWORD=postgres
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, subprocess
          status=json.load(open(os.environ["RUNNER_TEMP"]+"/pilot-auth-status.json"))
          api=status["API_URL"]+"/auth/v1"
          key=status.get("ANON_KEY") or status["PUBLISHABLE_KEY"]
          def request(path, data):
              req=urllib.request.Request(api+path, data=json.dumps(data).encode(), headers={"apikey":key,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as res:
                      print(f"Auth {path}: HTTP {res.status}", flush=True)
                      return json.load(res)
              except urllib.error.HTTPError as error:
                  try:
                      body = json.load(error)
                  except ValueError:
                      body = {}
                  print(f"Auth {path}: HTTP {error.code}; error fields: " + json.dumps(
                      {key: body[key] for key in ("code", "error_code", "error_id") if key in body}
                  ), flush=True)
                  raise
          def auth_sql(query):
              return ["docker","exec","-i","-u","postgres","supabase_db_pilot-auth","psql","-U","supabase_admin","-d","postgres","-X","-v","ON_ERROR_STOP=1","-v","VERBOSITY=verbose","-At","-c","SET ROLE supabase_auth_admin; "+query]
          def sql(query):
              return subprocess.check_output(["psql",status["DB_URL"],"-X","-v","ON_ERROR_STOP=1","-At","-c",query],text=True).strip()
          password="Local-test-only-Password-837!"
          email="pilot@example.test"
          request("/signup",{"email":email,"password":password})
          user=request("/token?grant_type=password",{"email":email,"password":password})["user"]
          uid=user["id"]
          import uuid
          uuid.UUID(uid)
          assert sql("select count(*) from auth.users where id='"+uid+"'")=="1"
          sql("insert into public.profiles values ('"+uid+"','pilot@example.test','admin',true,false); insert into microsoft_pilot_private.allowed_accounts values ('"+uid+"','pilot@example.test')")
          request("/signup",{"email":"student-pilot-local@nkcswx.cn","password":password})
          other=request("/token?grant_type=password",{"email":"student-pilot-local@nkcswx.cn","password":password})["user"]["id"]
          uuid.UUID(other)
          assert subprocess.check_output(auth_sql("select public.microsoft_pilot_before_user_created('{\"user\":{\"app_metadata\":{\"provider\":\"azure\"}}}'::jsonb)->'error'->>'http_code'"),text=True).strip().splitlines()[-1]=="403"
          def identity(target, verified, address, allowed):
              q="insert into auth.identities (provider_id,user_id,identity_data,provider,created_at,updated_at,last_sign_in_at) values ('test-"+target+"','"+target+"',jsonb_build_object('email','"+address+"','email_verified',"+str(verified).lower()+",'sub','test-"+target+"'),'azure',now(),now(),now())"
              p=subprocess.run(auth_sql(q),capture_output=True,text=True)
              assert (p.returncode==0)==allowed, p.stderr
              if not allowed:
                  assert "42501: Microsoft identity is outside the Hub approved account pilot" in p.stderr, p.stderr
              print(f"Synthetic identity write passed assertion: allowed={allowed}, verified={verified}", flush=True)
          sql("insert into public.profiles values ('"+other+"','student-pilot-local@nkcswx.cn','student',true,false)")
          identity(other,True,"student-pilot-local@nkcswx.cn",False)
          sql("update public.profiles set role='admin' where id='"+other+"'")
          identity(other,True,"student-pilot-local@nkcswx.cn",False)
          sql("update public.profiles set role='student' where id='"+other+"'")
          sql("insert into microsoft_pilot_private.allowed_accounts values ('"+other+"','student-pilot-local@nkcswx.cn')")
          identity(other,True,"student-pilot-local@nkcswx.cn",False)
          sql("delete from microsoft_pilot_private.allowed_accounts where user_id='"+other+"'")
          identity(uid,False,email,False)
          identity(uid,True,"wrong@example.test",False)
          identity(uid,True,email,True)
          azure = next(item for item in request(
              "/token?grant_type=password", {"email": email, "password": password}
          )["user"]["identities"] if item["provider"] == "azure")
          assert azure["user_id"] == uid
          assert azure["identity_data"]["email_verified"] is True
          assert sql("select created_at is not null and updated_at is not null from auth.identities where provider='azure'") == "t"
          def reject_azure_update(query):
              result = subprocess.run(auth_sql(query), capture_output=True, text=True)
              assert result.returncode != 0 and "42501: Microsoft identity is outside the Hub approved account pilot" in result.stderr, result.stderr
          reject_azure_update("update auth.identities set user_id='" + other + "' where provider='azure'")
          for field in ("active", "must_change_password"):
              original = field == "active"
              sql(f"update public.profiles set {field}={str(not original).lower()} where id='{uid}'")
              reject_azure_update("update auth.identities set last_sign_in_at=now() where provider='azure'")
              sql(f"update public.profiles set {field}={str(original).lower()} where id='{uid}'")
          subprocess.check_call(auth_sql("update auth.identities set last_sign_in_at=now() where provider='azure'"))
          for role in ("anon", "authenticated"):
              assert sql(f"select has_schema_privilege('{role}', 'microsoft_pilot_private', 'USAGE')") == "f"
          assert request("/token?grant_type=password", {"email": "student-pilot-local@nkcswx.cn", "password": password})["user"]["id"] == other
          assert sql("select count(*) from public.profiles where role='admin' and active and not must_change_password") == "1"
          assert sql("select count(*) from auth.users")=="2"
          assert sql("select count(*) from auth.identities where provider='azure' and user_id='"+uid+"'")=="1"
          # An explicit student approval permits the existing matching UUID only.
          student_email="student-pilot-local@nkcswx.cn"
          sql("insert into microsoft_pilot_private.allowed_accounts (user_id,school_email,approved_role) values ('"+other+"','"+student_email+"','student')")
          identity(other,False,student_email,False)
          identity(other,True,"wrong@nkcswx.cn",False)
          sql("update public.profiles set role='teacher' where id='"+other+"'")
          identity(other,True,student_email,False)
          sql("update public.profiles set role='admin' where id='"+other+"'")
          identity(other,True,student_email,False)
          sql("update public.profiles set role='student',active=false where id='"+other+"'")
          identity(other,True,student_email,False)
          sql("update public.profiles set active=true,must_change_password=true where id='"+other+"'")
          identity(other,True,student_email,False)
          sql("update public.profiles set must_change_password=false where id='"+other+"'")
          identity(other,True,student_email,True)
          linked=request("/token?grant_type=password",{"email":student_email,"password":password})["user"]
          assert linked["id"]==other
          assert len([i for i in linked["identities"] if i["provider"]=="azure" and i["user_id"]==other])==1
          assert sql("select count(*) from auth.users")=="2"
          assert sql("select count(*) from public.profiles")=="2"
          assert sql("select count(*) from auth.identities where provider='azure'")=="2"
          assert sql("select approved_role from microsoft_pilot_private.allowed_accounts where user_id='"+uid+"'")=="admin"
          sql("delete from microsoft_pilot_private.allowed_accounts where user_id='"+other+"'")
          reject_azure_update("update auth.identities set last_sign_in_at=now() where provider='azure' and user_id='"+other+"'")
          assert request("/token?grant_type=password",{"email":student_email,"password":password})["user"]["id"]==other
          print("PASS: administrator and explicitly approved student identity guards, UUID continuity, role changes and password fallback on real local Auth. Microsoft OAuth callback NOT tested.")
          PY
      - name: Record Auth database failure before teardown
        if: failure()
        shell: bash
        run: |
          docker logs supabase_auth_pilot-auth 2>&1 | python3 -c '
          import json, re, sys
          for line in sys.stdin:
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              if event.get("level") != "error":
                  continue
              error = str(event.get("error", ""))
              column = next((name for name in ("created_at", "updated_at", "last_sign_in_at") if name in error), None)
              sqlstate = re.search(r"SQLSTATE ([0-9A-Z]{5})", error)
              print(json.dumps({
                  "scan_error": "Scan error" in error or "scan error" in error,
                  "null_conversion": ("null" in error.lower() or "<nil>" in error.lower()),
                  "column": column,
                  "sqlstate": sqlstate.group(1) if sqlstate else None,
                  "pilot_guard": "outside the Hub approved account pilot" in error,
              }))
          '
      - name: Stop local stack
        if: always()
        run: |
          cd "$RUNNER_TEMP/pilot-auth" && supabase stop --no-backup
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Hub authentication and password recovery
        run: >-
          node --test
          tests/auth-flow.test.js
          tests/login-password-visibility.test.js
          tests/password-recovery.test.mjs
          tests/return-target.test.js
          tests/microsoft-staff-sign-in.test.js
      - name: Verify Writing Academy regressions
        run: >-
          node --test
          tests/writing-academy-foundation.test.js
          tests/writing-activity.test.js
          tests/review-academy-pedagogy.test.mjs
          tests/writing-academy-persistence.test.js
          tests/writing-academy-preview-progress.test.js
          tests/writing-academy-recognition.test.js
