name: Temporary Vocabulary Sound Patch Helper
on:
  push:
    branches: ['fix/vocabulary-sound-assets']
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sound-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vocabulary-sound-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-vocabulary-sound-assets.mjs
      - name: Commit exact patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vocabulary/app.js src/vocabulary/games/games-controller.js src/vocabulary/sounds
          git commit -m 'feat(vocabulary): wire local sound feedback [sound-patched]'
          git push origin HEAD:fix/vocabulary-sound-assets
