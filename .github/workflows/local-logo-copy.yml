name: Local Logo Copy

on:
  push:
    branches:
      - fix/local-logo-20261015

permissions:
  contents: write

jobs:
  copy-logo:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy approved Evidence Hub Schools logo into Hub
        run: |
          set -e
          mkdir -p assets
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            /repos/tobypottas-sketch/evidence-hub-schools-showcase/contents/01_FRONTEND/images/evidence-hub-schools-logo-approved.webp?ref=main \
            > assets/evidence-hub-schools-logo.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('src/views/home.js')
          s = p.read_text()
          old = 'https://raw.githubusercontent.com/tobypottas-sketch/evidence-hub-schools-showcase/main/01_FRONTEND/images/evidence-hub-schools-logo-approved.webp'
          new = './assets/evidence-hub-schools-logo.webp'
          if old not in s and new not in s:
              raise SystemExit('Expected logo reference not found')
          p.write_text(s.replace(old, new))
          PY
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/evidence-hub-schools-logo.webp src/views/home.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Store Evidence Hub Schools logo locally"
          git push origin HEAD:fix/local-logo-20261015
