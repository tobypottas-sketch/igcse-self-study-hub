name: Unit 10 Visual PR Verification
on:
  pull_request:
    paths:
      - 'tests/vocabulary-unit10-visual-pr.test.mjs'
      - 'src/vocabulary/graphics-**'
      - 'src/vocabulary/views.js'
      - 'vocabulary-graphics.css'
      - 'vocabulary-unit-themes.css'
      - 'assets/vocabulary/units/unit-10.png'
      - 'assets/vocabulary/delivery/units/unit-10.*'
      - '.github/workflows/unit10-visual-pr.yml'
  workflow_dispatch:
jobs:
  chromium-unit-10:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Use GitHub runner Chrome (download only if unavailable)
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
            echo "Using existing runner Chrome: $CHROME"
          else
            npx playwright install chromium
          fi
      - name: Run Unit 10 authored content and assessment regressions
        run: |
          node --test tests/vocabulary-unit-10-check.test.js tests/vocabulary-unit-10-release.test.js tests/vocabulary-unit-10-words-1-48.test.js tests/vocabulary-games-unit-10.test.js
          node scripts/validate-vocabulary-content.mjs
      - name: Render real Unit 10 at 1440px and 390px
        env:
          UNIT10_SHOTS_DIR: /tmp/unit10-shots
        run: node --test tests/vocabulary-unit10-visual-pr.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit10-visual-screenshots
          path: /tmp/unit10-shots/
          if-no-files-found: warn
          retention-days: 7
