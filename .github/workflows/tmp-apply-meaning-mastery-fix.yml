name: Apply Meaning Mastery Fix

on:
  push:
    branches:
      - fix/meaning-mastery-reviewed-equivalent
    paths:
      - '.github/workflows/tmp-apply-meaning-mastery-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meaning-mastery-reviewed-equivalent
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/tmp-apply-meaning-mastery-fix.mjs
      - run: npm test
      - run: node scripts/validate-vocabulary-content.mjs
      - name: Remove temporary patch machinery
        run: rm scripts/tmp-apply-meaning-mastery-fix.mjs .github/workflows/tmp-apply-meaning-mastery-fix.yml
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Meaning Mastery context-to-meaning inference contract'
          git push origin HEAD:fix/meaning-mastery-reviewed-equivalent
