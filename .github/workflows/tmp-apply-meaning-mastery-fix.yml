name: Finalize Meaning Mastery Fix

on:
  push:
    branches:
      - fix/meaning-mastery-reviewed-equivalent
    paths:
      - '.github/workflows/tmp-apply-meaning-mastery-fix.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meaning-mastery-reviewed-equivalent
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tmp-apply-meaning-mastery-fix.mjs
      - name: Run full tests
        id: tests
        continue-on-error: true
        run: |
          rm -f tmp-final-meaning-mastery-test.log
          npm test > tmp-final-meaning-mastery-test.log 2>&1
      - name: Capture failing output
        if: ${{ steps.tests.outcome == 'failure' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-final-meaning-mastery-test.log
          git commit -m 'chore: capture nondeterministic Meaning Mastery failure'
          git push origin HEAD:fix/meaning-mastery-reviewed-equivalent
          exit 1
      - run: node scripts/validate-vocabulary-content.mjs
      - name: Commit verified fix and remove temporary files
        run: |
          rm -f scripts/tmp-apply-meaning-mastery-fix.mjs .github/workflows/tmp-apply-meaning-mastery-fix.yml tmp-meaning-mastery-test.log tmp-final-meaning-mastery-test.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Meaning Mastery context-to-meaning inference contract'
          git push origin HEAD:fix/meaning-mastery-reviewed-equivalent
